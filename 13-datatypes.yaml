- name: course information
  hosts: local
  connection: local
  vars:
    course: "AIOps with DevSecops on AWS"  # just string data type
    duration_in_hrs: 150 # number
    is_live_sessions: true # boolean  
    Topics: # list
    - Linux
    - Shell
    - Ansible
    - Terraform
    more_details:  # dictionary/maps
      trainer: sivakumar M 
      months: 4
    exact_duration_in_months: 4.5

  tasks:
  - name: print info and type
    debug:
      msg: |
        name: "{{ course }} : {{ course | type_debug }}"
        duration: "{{ duration_in_hrs }} : {{ duration_in_hrs | type_debug }}"
        is live: "{{ is_live_sessions }} : {{ is_live_sessions | type_debug }}"
        Topics: "{{ Topics }} : {{ Topics | type_debug }}"
        moredetails: "{{ more_details }} : {{ more_details | type_debug }}"
        exact duration: "{{ exact_duration_in_months }} : {{ exact_duration_in_months | type_debug }}"
  