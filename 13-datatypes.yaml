- name: course information
  hosts: local
  connection: local
  vars:
    course: "AIOps with DevSecops on AWS"  # just string data type
    duration_in_hrs: 150 # number
    is _live_sessions: true # boolean  
    Topics: # list
    - Linux
    - Shell
    - Ansible
    - Terraform
    more_details:  # dictionary/maps
      trainer: sivakumar M 
      months: 4
    exact_duration_in_months: 4.5

    tasks:
    - name: print info type
      debug:
        msg: |
          name: "{{ course }} : {{ course | type_debug }}"