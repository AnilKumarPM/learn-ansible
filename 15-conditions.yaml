- name: print OS is Redhat or not
  hosts: local
  connection: local
  tasks:
  - name: install nginx in RedHat
    dnf: 
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat"

  - name: pinstall nginx in Debian 
    apt: 
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debian"