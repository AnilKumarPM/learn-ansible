- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: "Linux, Shell, Ansible, Terraform, Docker"
    names:
    - Anil 
    - Kumar
    - PM
    topic: ANSIBLE
  tasks:
  - name: print the name
    debug:
      msg: "Hi, {{person_name | default('Ramesh')}} "

  - name: convert string to list 
    debug:
      msg: " Topics are: {{ topics | split(',') | trim }} "

  - name: convert list to string
    debug:
      msg: " {{ names | join(' ') }} "

  - name: convert into lower
    debug:
      msg: "Topic : {{ topic | lower }}"