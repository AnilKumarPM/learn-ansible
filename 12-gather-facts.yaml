- name: print fatcs
  hosts: local
  connection: local
  tasks:
  - name: print the fatcs
    debug:
      msg: "{{ ansible_facts }}"

  - name: print some info from facts
    debug:
      msg: |
        OS Family: {{ ansible_facts['os_family'] }}
        private_IP: {{ ansible_facts.default_ipv4.address }}
        private_IP: {{ ansible_facts['default_ipv4']['address'] }}