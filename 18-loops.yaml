- name: install packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - { name: 'nginx', state: 'absent'} 
    - { name: 'mysql', state: 'absent'}
    - { name: 'git', state: 'abscent'}
    - { name: 'net-tools', state: 'present'}
    - { name: 'htop', state: 'abscent'}
  tasks:
  - name: Install packages
    package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"
     
